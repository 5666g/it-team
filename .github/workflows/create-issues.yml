name: Setup Lab Issues

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Create 8 Lab Issues for Students
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Создание 8 учебных задач в репозитории $GH_REPO..."

          # Задача 1
          gh issue create --title "[Task 1] Заполнение страницы участников команды (pages/team.html)" \
            --label "lab-task,student-1" \
            --body "$(cat << 'EOF'
          ### Задача №1 (Студент 1)
          **Файл для изменения:** `pages/team.html`
          **Рекомендуемая ветка:** `feature/team-members`
          **Пример коммита:** `feat: добавить карточки участников команды`

          #### Что нужно сделать:
          1. Открыть `pages/team.html`.
          2. Заменить блок заглушки `<div class="stub-box">...</div>` на секцию с карточками участников (минимум 3 человека).
          3. Использовать шаблон карточек из `pages/template.html` (или раскомментировать готовый пример в файле).
          4. Проверить отображение страницы в браузере.
          5. Зафиксировать изменения в ветке `feature/team-members` и открыть Pull Request в `main` оригинального репозитория.

          #### Критерии готовности:
          - [ ] Заглушка удалена, на её месте отображаются карточки участников.
          - [ ] Навигация и общие стили сохранены.
          - [ ] Создан Pull Request с понятным описанием.
          EOF
          )"

          # Задача 2
          gh issue create --title "[Task 2] Заполнение страницы проектов команды (pages/projects.html)" \
            --label "lab-task,student-2" \
            --body "$(cat << 'EOF'
          ### Задача №2 (Студент 2)
          **Файл для изменения:** `pages/projects.html`
          **Рекомендуемая ветка:** `feature/projects-list`
          **Пример коммита:** `feat: добавить описание проектов команды`

          #### Что нужно сделать:
          1. Открыть `pages/projects.html`.
          2. Заменить блок заглушки на карточки IT-проектов команды (минимум 3 проекта).
          3. Указать название, бейдж статуса (В релизе, В разработке, Open Source), описание и технологии.
          4. Проверить в браузере и открыть Pull Request из ветки `feature/projects-list`.

          #### Критерии готовности:
          - [ ] Добавлены минимум 3 проекта.
          - [ ] Стили и шапка сайта не нарушены.
          - [ ] Открыт Pull Request.
          EOF
          )"

          # Задача 3
          gh issue create --title "[Task 3] Заполнение страницы технологического стека (pages/technologies.html)" \
            --label "lab-task,student-3" \
            --body "$(cat << 'EOF'
          ### Задача №3 (Студент 3)
          **Файл для изменения:** `pages/technologies.html`
          **Рекомендуемая ветка:** `feature/technologies-stack`
          **Пример коммита:** `feat: описать технологический стек`

          #### Что нужно сделать:
          1. Открыть `pages/technologies.html`.
          2. Заменить блок заглушки на обзор направлений разработки (Frontend, Backend, DevOps и др.).
          3. Описать используемые языки, фреймворки и инструменты.
          4. Открыть Pull Request из ветки `feature/technologies-stack`.

          #### Критерии готовности:
          - [ ] Описаны минимум 3 технологических направления.
          - [ ] Верстка адаптивна, ошибки в разметке отсутствуют.
          - [ ] Открыт Pull Request.
          EOF
          )"

          # Задача 4
          gh issue create --title "[Task 4] Заполнение страницы «О команде» (pages/about.html)" \
            --label "lab-task,student-4" \
            --body "$(cat << 'EOF'
          ### Задача №4 (Студент 4)
          **Файл для изменения:** `pages/about.html`
          **Рекомендуемая ветка:** `feature/about-us`
          **Пример коммита:** `feat: добавить историю и принципы команды`

          #### Что нужно сделать:
          1. Открыть `pages/about.html`.
          2. Заменить блок заглушки на карточки с историей основания команды, её миссией и ценностями.
          3. Открыть Pull Request из ветки `feature/about-us`.

          #### Критерии готовности:
          - [ ] Раскрыты история, цели и культура команды.
          - [ ] Стили подключены корректно.
          - [ ] Открыт Pull Request.
          EOF
          )"

          # Задача 5
          gh issue create --title "[Task 5] Заполнение страницы контактов (pages/contacts.html)" \
            --label "lab-task,student-5" \
            --body "$(cat << 'EOF'
          ### Задача №5 (Студент 5)
          **Файл для изменения:** `pages/contacts.html`
          **Рекомендуемая ветка:** `feature/contacts-info`
          **Пример коммита:** `feat: добавить контактную информацию`

          #### Что нужно сделать:
          1. Открыть `pages/contacts.html`.
          2. Заменить блок заглушки на карточки официальных каналов связи (GitHub, Telegram-чат, публичный e-mail).
          3. Внимание: запрещено указывать личные телефоны и персональные данные!
          4. Открыть Pull Request из ветки `feature/contacts-info`.

          #### Критерии готовности:
          - [ ] Оформлены публичные контакты.
          - [ ] Персональные конфиденциальные данные отсутствуют.
          - [ ] Открыт Pull Request.
          EOF
          )"

          # Задача 6
          gh issue create --title "[Task 6] Заполнение страницы достижений (pages/achievements.html)" \
            --label "lab-task,student-6" \
            --body "$(cat << 'EOF'
          ### Задача №6 (Студент 6)
          **Файл для изменения:** `pages/achievements.html`
          **Рекомендуемая ветка:** `feature/achievements-list`
          **Пример коммита:** `feat: оформить карточки достижений`

          #### Что нужно сделать:
          1. Открыть `pages/achievements.html`.
          2. Заменить блок заглушки на карточки достижений и побед команды (минимум 3 достижения).
          3. Использовать иконки и бейджи наград.
          4. Открыть Pull Request из ветки `feature/achievements-list`.

          #### Критерии готовности:
          - [ ] Добавлены минимум 3 достижения.
          - [ ] Страница проверена локально в браузере.
          - [ ] Открыт Pull Request.
          EOF
          )"

          # Задача 7
          gh issue create --title "[Task 7] Заполнение страницы мероприятий (pages/events.html)" \
            --label "lab-task,student-7" \
            --body "$(cat << 'EOF'
          ### Задача №7 (Студент 7)
          **Файл для изменения:** `pages/events.html`
          **Рекомендуемая ветка:** `feature/events-schedule`
          **Пример коммита:** `feat: добавить расписание мероприятий`

          #### Что нужно сделать:
          1. Открыть `pages/events.html`.
          2. Заменить блок заглушки на карточки календаря событий (воркшопы, митапы, хакатоны).
          3. Указать даты, формат проведения и темы.
          4. Открыть Pull Request из ветки `feature/events-schedule`.

          #### Критерии готовности:
          - [ ] Сформировано расписание минимум из 3 событий.
          - [ ] Разметка валидна.
          - [ ] Открыт Pull Request.
          EOF
          )"

          # Задача 8
          gh issue create --title "[Task 8] Заполнение страницы полезных ресурсов (pages/resources.html)" \
            --label "lab-task,student-8" \
            --body "$(cat << 'EOF'
          ### Задача №8 (Студент 8)
          **Файл для изменения:** `pages/resources.html`
          **Рекомендуемая ветка:** `feature/learning-resources`
          **Пример коммита:** `feat: добавить список полезных ресурсов`

          #### Что нужно сделать:
          1. Открыть `pages/resources.html`.
          2. Заменить блок заглушки на подборку полезных ссылок по Git и веб-технологиям.
          3. Добавить ссылки (Pro Git, Learn Git Branching, MDN Web Docs) с атрибутом `target="_blank"`.
          4. Открыть Pull Request из ветки `feature/learning-resources`.

          #### Критерии готовности:
          - [ ] Оформлены минимум 3 образовательных ресурса со ссылками.
          - [ ] Открыт Pull Request.
          EOF
          )"

          echo "Все 8 задач успешно созданы!"
